name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Protocol tests
        run: python -m unittest discover -s tests -v
      - name: Install the CLI
        run: python -m pip install .
      - name: Model-free demo of a whole loop
        run: bash scripts/demo.sh
      - name: The example oracle proves its checks can fail
        run: python examples/slugify/oracle/selftest.py
